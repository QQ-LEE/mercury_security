<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水星安防 - 3D产品展示</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', 'Noto Sans SC', sans-serif; overflow: hidden; background: #f5f5f5; }
    .top-bar { position: absolute; top: 0; left: 0; right: 0; height: 52px; background: white; border-bottom: 1px solid #e8e8e8; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: #1a1a1a; }
    .brand-dot { width: 8px; height: 8px; background: #0066ff; border-radius: 50%; }
    .top-actions { display: flex; gap: 12px; }
    .top-btn { padding: 8px 16px; border: 1px solid #ddd; border-radius: 6px; background: white; font-size: 13px; cursor: pointer; transition: all 0.2s; color: #555; }
    .top-btn:hover { border-color: #0066ff; color: #0066ff; }
    .top-btn.primary { background: #0066ff; color: white; border-color: #0066ff; }
    .model-switcher { position: absolute; top: 80px; left: 24px; display: flex; gap: 8px; z-index: 10; }
    .model-tab { padding: 10px 20px; border-radius: 8px; border: 1px solid #ddd; background: white; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; color: #666; }
    .model-tab.active { background: #0066ff; color: white; border-color: #0066ff; }
    #control-panel { position: absolute; top: 80px; right: 24px; background: white; border-radius: 12px; padding: 20px; width: 260px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); z-index: 10; }
    .panel-title { font-size: 13px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .material-cards { display: flex; gap: 8px; }
    .material-card { width: 120px; border-radius: 8px; border: 2px solid #e0e0e0; cursor: pointer; overflow: hidden; background: white; }
    .material-card.active { border-color: #0066ff; box-shadow: 0 0 0 3px rgba(0,102,255,0.15); }
    .material-card .card-preview { width: 100%; height: 60px; background-size: cover; background-position: center; }
    .material-card .card-label { padding: 8px; font-size: 13px; text-align: center; color: #666; }
    .material-card.white .card-preview { background: repeating-conic-gradient(#f5f5f5 0% 25%, #ffffff 0% 50%) 50% / 12px 12px; }
    .material-card.gray .card-preview { background-image: url('./QXJ-2.jpg'); }
    .install-btn { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #e0e0e0; background: white; font-size: 14px; font-weight: 500; cursor: pointer; color: #333; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .install-btn:hover { border-color: #0066ff; color: #0066ff; }
    .install-btn.playing { background: #fff3e0; border-color: #ff9800; color: #ff9800; }
    .install-controls { display: flex; gap: 6px; margin-top: 8px; }
    .install-mini-btn { flex: 1; padding: 8px; border: 1px solid #e0e0e0; border-radius: 6px; background: white; font-size: 12px; cursor: pointer; color: #666; text-align: center; }
    .hotspot-tooltip { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: auto; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 16px; padding: 24px 28px; box-shadow: 0 12px 40px rgba(0,0,0,0.1); font-size: 14px; color: #333; display: none; z-index: 100; max-width: 340px; } .tooltip-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.25); backdrop-filter: blur(5px); display: none; z-index: 99; } .tooltip-title { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 14px; } .tooltip-detail { font-size: 14px; color: #555; line-height: 2.0; white-space: pre-line; }
    #info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #bbb; pointer-events: none; z-index: 5; }
    #fullscreen-btn { position: absolute; bottom: 24px; right: 24px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid #ddd; background: white; font-size: 18px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="top-bar"><div class="brand"><span class="brand-dot"></span>水星安防 MERCURY</div><div class="top-actions"><button class="top-btn" id="btn-reset">🔄 重置视角</button><button class="top-btn primary" id="btn-fullscreen">⛶ 全屏查看</button></div></div>
  <div class="model-switcher"><button class="model-tab active" id="btn-bullet">📷 枪型摄像机</button><button class="model-tab" id="btn-dome">📹 球形摄像机</button></div>
  <div id="control-panel"><div class="panel-title">外观配置</div><div class="panel-section"><div class="section-label">机身配色</div><div class="material-cards"><div class="material-card white active" id="card-white"><div class="card-preview"></div><div class="card-label">白色</div></div><div class="material-card gray" id="card-gray"><div class="card-preview"></div><div class="card-label">灰色</div></div></div></div><div class="panel-section"><div class="section-label">安装演示</div><button class="install-btn" id="btn-install">🔧 播放安装动画</button><div class="install-controls"><button class="install-mini-btn" id="btn-pause">⏸ 暂停</button><button class="install-mini-btn" id="btn-reset-anim">↺ 重置</button></div></div></div>
  <div class="tooltip-overlay" id="tooltip-overlay"></div>
  <div class="hotspot-tooltip" id="hotspot-tooltip"><div class="tooltip-title" id="hotspot-title"></div><div class="tooltip-detail" id="hotspot-detail"></div></div>
  <button id="fullscreen-btn">⛶</button>
  <div id="info">🖱 拖拽旋转 | 滚轮缩放 | 右键平移 | 悬停产品查看参数</div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.157.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.157.0/examples/jsm/" } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf5f5f5);
// 50度广角相机（与Max中的Free Camera一致）
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0.4, 0.25, 0.6);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(0.5, 0.8, 0.5);
    keyLight.castShadow = true;
    scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xc8d6ff, 1.0);
    fillLight.position.set(-0.3, 0.2, -0.2);
    scene.add(fillLight);

    const gridHelper = new THREE.PolarGridHelper(0.4, 24, 16, 64, 0xcccccc, 0xcccccc);
    scene.add(gridHelper);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.08, 0);
    controls.minDistance = 0.1;
    controls.maxDistance = 3;
    controls.update();

    let currentModel = 'bullet';
    let modelGroup = new THREE.Group();
    let animationGroup = new THREE.Group();
    let isInstallPlaying = false;
    let animationMixer = null;
    let modelAnimationMixer = null;
    let animationCamera = null;
    let isUsingAnimationCamera = false;
    
    // 动画配置
    const animationConfig = {
      bullet: { file: './Q_AZ.glb', useCamera: true, useExternal: true },
      dome: { file: './K_JK.glb', useCamera: false, useExternal: false } // 球形机使用模型自带的动画
    };
    
    // 相机旋转放大倍数（用于增强转头效果）
    const ROTATION_MULTIPLIER = 4;
    
    const textureLoader = new THREE.TextureLoader();
    const textureConfig = { bullet: { gray: './js3.jpg' }, dome: { gray: './QXJ-2.jpg' } };
    scene.add(modelGroup);
    scene.add(animationGroup);

    const hotspotData = {
      lens: { title: '📷 镜头区域', detail: '400万像素 | f/1.6光圈\n2.8mm/4mm焦距可选\n智能红外/全彩夜视' },
      light: { title: '💡 补光灯区', detail: '双光全彩夜视\n红外距离30米\n智能光线调节' },
      port: { title: '🔌 网口区域', detail: 'PoE供电（802.3af）\n10/100M自适应\n支持H.265+编码' },
      body: { title: '🛡 机身防护', detail: 'IP67防尘防水\n-30°C~60°C工作\n金属+工程塑料' }
    };

    function createStandardMaterialWithTexture(texturePath) {
      return new Promise((resolve, reject) => {
        textureLoader.load(texturePath, (tex) => {
          tex.flipY = false;
          tex.colorSpace = THREE.SRGBColorSpace;
          resolve(new THREE.MeshStandardMaterial({ map: tex, roughness: 0.4, metalness: 0.1 }));
        }, undefined, reject);
      });
    }

    async function applyGrayColor() {
      const texturePath = textureConfig[currentModel]?.gray;
      if (!texturePath) return;
      const newMaterial = await createStandardMaterialWithTexture(texturePath);
      modelGroup.traverse(child => {
        if (child.isMesh && child.name.toLowerCase().includes('body')) {
          child.material = newMaterial.clone();
        }
      });
    }

    const loader = new GLTFLoader();
    const loadingOverlay = document.createElement('div');
    loadingOverlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(245,245,245,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100';
    loadingOverlay.innerHTML = '<div style="font-size:48px;margin-bottom:16px;">📦</div><div style="font-size:16px;color:#666;">正在加载模型...</div>';
    document.body.appendChild(loadingOverlay);

    function loadModel(filePath) {
      return new Promise((resolve) => {
        while(modelGroup.children.length > 0) modelGroup.remove(modelGroup.children[0]);
        loader.load(filePath, (gltf) => {
          gltf.scene.traverse(child => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              if (child.material?.map) {
                child.material.map.flipY = false;
                child.material.map.colorSpace = THREE.SRGBColorSpace;
              }
            }
          });
          
          // 保存模型自带的动画
          if (gltf.animations.length > 0) {
            modelAnimationMixer = new THREE.AnimationMixer(gltf.scene);
            gltf.animations.forEach(clip => {
              const action = modelAnimationMixer.clipAction(clip);
              action.setLoop(THREE.LoopOnce);
              action.clampWhenFinished = true;
            });
            console.log('📊 模型自带动画:', gltf.animations.length, '个');
          } else {
            modelAnimationMixer = null;
            console.log('📊 模型没有自带动画');
          }
          
          modelGroup.add(gltf.scene);
          resolve();
        }, undefined, () => resolve());
      });
    }

    async function loadBulletCamera() {
      loadingOverlay.style.display = 'flex';
      await loadModel('./Q_JK.glb');
      loadingOverlay.style.display = 'none';
    }

    async function loadDomeCamera() {
      loadingOverlay.style.display = 'flex';
      await loadModel('./K_JK.glb');
      loadingOverlay.style.display = 'none';
    }

    async function loadInstallAnimation() {
      const config = animationConfig[currentModel];
      return new Promise((resolve, reject) => {
        while(animationGroup.children.length > 0) animationGroup.remove(animationGroup.children[0]);
        loader.load(config.file, (gltf) => {
          animationCamera = null;
          const config = animationConfig[currentModel];
          gltf.scene.traverse(child => {
            if (child.isCamera && config.useCamera) {
              animationCamera = child;
              console.log('🎬 发现动画相机:', child.name);
              console.log('   初始位置:', child.position);
              console.log('   初始旋转:', child.rotation);
            }
            if (child.isMesh) { child.castShadow = true; child.receiveShadow = true; }
          });
          
          // 调试：显示动画信息
          console.log('📊 动画数量:', gltf.animations.length);
          gltf.animations.forEach((clip, index) => {
            console.log(`   动画${index}: ${clip.name}, 时长: ${clip.duration.toFixed(2)}s`);
            // 显示动画轨道
            clip.tracks.forEach(track => {
              const targetName = track.name.split('.')[0];
              const property = track.name.split('.')[1];
              console.log(`      轨道: ${targetName} → ${property}`);
            });
          });
          
          animationGroup.add(gltf.scene);
          if (animationMixer) animationMixer.stopAllAction();
          animationMixer = gltf.animations.length > 0 ? new THREE.AnimationMixer(gltf.scene) : null;
          if (animationMixer) {
            gltf.animations.forEach(clip => {
              const action = animationMixer.clipAction(clip);
              action.setLoop(THREE.LoopOnce);
              action.clampWhenFinished = true;
            });
          }
          resolve();
        }, undefined, reject);
      });
    }

    async function switchModel(type) {
      currentModel = type;
      document.querySelectorAll('.model-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`#btn-${type}`).classList.add('active');
      
      // 切换模型时重置动画状态
      if (animationMixer) {
        animationMixer.stopAllAction();
        animationMixer = null; // 清空动画混合器，强制重新加载对应模型的动画
      }
      animationGroup.visible = false;
      
      if (type === 'bullet') {
        await loadBulletCamera();
      } else {
        await loadDomeCamera();
      }
    }

    function switchColor(color) {
      document.querySelectorAll('.material-card').forEach(c => c.classList.remove('active'));
      document.querySelector(`#card-${color}`).classList.add('active');
      if (color === 'white') {
        switchModel(currentModel);
      } else if (color === 'gray') {
        applyGrayColor();
      }
    }

    function resetCamera() {
      isUsingAnimationCamera = false;
      camera.position.set(0.4, 0.25, 0.6);
      camera.fov = 50; // 与Max中的Free Camera一致
      controls.target.set(0, 0.08, 0);
      controls.update();
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        document.body.requestFullscreen();
      }
    }

    async function toggleInstallAnimation() {
      if (isInstallPlaying) {
        pauseInstallAnimation();
        return;
      }
      
      const config = animationConfig[currentModel];
      
      // 枪型机：使用外部动画
      if (config.useExternal) {
        if (!animationMixer) {
          loadingOverlay.style.display = 'flex';
          try {
            await loadInstallAnimation();
          } catch {
            alert('动画加载失败');
            loadingOverlay.style.display = 'none';
            return;
          }
          loadingOverlay.style.display = 'none';
        }
        
        modelGroup.visible = false;
        animationGroup.visible = true;
        
        if (animationMixer) {
          animationMixer._actions.forEach(action => { action.reset(); action.play(); });
          animationMixer.timeScale = 1;
        }
      } else {
        // 球形机：使用模型自带的动画
        if (!modelAnimationMixer) {
          alert('该模型没有动画');
          return;
        }
        
        modelAnimationMixer._actions.forEach(action => { action.reset(); action.play(); });
        modelAnimationMixer.timeScale = 1;
      }
      
      isInstallPlaying = true;
      isUsingAnimationCamera = config.useCamera;
      document.getElementById('btn-install').textContent = '⏸ 暂停动画';
      document.getElementById('btn-install').classList.add('playing');
    }

    function pauseInstallAnimation() {
      if (animationMixer) animationMixer.timeScale = 0;
      isInstallPlaying = false;
      document.getElementById('btn-install').textContent = '▶ 继续动画';
      document.getElementById('btn-install').classList.remove('playing');
    }

    function resetInstallAnimation() {
      if (animationMixer) animationMixer.stopAllAction();
      isInstallPlaying = false;
      isUsingAnimationCamera = false;
      animationGroup.visible = false;
      modelGroup.visible = true;
      document.getElementById('btn-install').textContent = '🔧 播放动画';
      document.getElementById('btn-install').classList.remove('playing');
      resetCamera();
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const tooltip = document.getElementById('hotspot-tooltip');
    const tooltipOverlay = document.getElementById('tooltip-overlay');
    
    function findMatchingHotspot(objectName) {
      const lowerName = objectName.toLowerCase();
      for (const key of Object.keys(hotspotData)) {
        const lowerKey = key.toLowerCase();
        if (lowerName === lowerKey || lowerName.startsWith(lowerKey) || lowerName.includes(lowerKey)) {
          return key;
        }
      }
      return null;
    }

    function showTooltip(data) {
      document.getElementById('hotspot-title').textContent = data.title;
      document.getElementById('hotspot-detail').textContent = data.detail;
      tooltip.style.display = 'block';
      tooltipOverlay.style.display = 'block';
      document.body.style.overflow = 'hidden';
    }

    function hideTooltip() {
      tooltip.style.display = 'none';
      tooltipOverlay.style.display = 'none';
      document.body.style.overflow = '';
    }

    // 点击模型部件显示产品信息
    window.addEventListener('click', (e) => {
      if (isInstallPlaying) return;
      
      // 检查是否点击了弹窗区域（点击弹窗关闭）
      if (e.target.closest('.hotspot-tooltip')) {
        hideTooltip();
        return;
      }
      
      // 计算归一化坐标
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -((e.clientY / window.innerHeight) * 2 - 1);
      raycaster.setFromCamera(mouse, camera);
      
      // 检测整个场景
      const allIntersects = raycaster.intersectObject(scene, true);
      
      // 过滤掉网格辅助线，保留模型对象
      const modelIntersects = allIntersects.filter(intersect => {
        const obj = intersect.object;
        return obj.isMesh && !obj.name.includes('Grid') && !obj.name.includes('Helper');
      });
      
      if (modelIntersects.length > 0) {
        const objName = modelIntersects[0].object.name || '未命名';
        const matchedKey = findMatchingHotspot(objName);
        
        if (matchedKey && hotspotData[matchedKey]) {
          showTooltip(hotspotData[matchedKey]);
        }
      }
    });

    // ESC键关闭弹窗
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        hideTooltip();
      }
    });

    // 点击遮罩层关闭弹窗
    tooltipOverlay.addEventListener('click', hideTooltip);

    // 添加事件监听
    document.getElementById('btn-reset').addEventListener('click', resetCamera);
    document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
    document.getElementById('btn-bullet').addEventListener('click', () => switchModel('bullet'));
    document.getElementById('btn-dome').addEventListener('click', () => switchModel('dome'));
    document.getElementById('card-white').addEventListener('click', () => switchColor('white'));
    document.getElementById('card-gray').addEventListener('click', () => switchColor('gray'));
    document.getElementById('btn-install').addEventListener('click', toggleInstallAnimation);
    document.getElementById('btn-pause').addEventListener('click', pauseInstallAnimation);
    document.getElementById('btn-reset-anim').addEventListener('click', resetInstallAnimation);
    document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

    const animClock = new THREE.Clock();
    loadBulletCamera();

    // 调试：显示相机状态
    let debugCount = 0;
    
    function animate() {
      requestAnimationFrame(animate);
      const delta = animClock.getDelta();
      
      if (isInstallPlaying) {
        const config = animationConfig[currentModel];
        
        // 枪型机：使用外部动画
        if (config.useExternal && animationMixer) {
          animationMixer.update(delta);
          
          // 检查动画是否完成
          const isFinished = animationMixer._actions.every(action => {
            return action.isRunning() === false || action.time >= action.getClip().duration;
          });
          
          if (isFinished) {
            resetInstallAnimation();
            return;
          }
          
          if (isUsingAnimationCamera && animationCamera) {
            const worldPos = new THREE.Vector3();
            const worldQuat = new THREE.Quaternion();
            animationCamera.matrixWorld.decompose(worldPos, worldQuat, new THREE.Vector3());
            
            camera.position.copy(worldPos);
            if (ROTATION_MULTIPLIER !== 1) {
              const euler = new THREE.Euler().setFromQuaternion(worldQuat, 'XYZ');
              euler.x *= ROTATION_MULTIPLIER;
              euler.y *= ROTATION_MULTIPLIER;
              euler.z *= ROTATION_MULTIPLIER;
              camera.quaternion.setFromEuler(euler);
            } else {
              camera.quaternion.copy(worldQuat);
            }
            camera.updateProjectionMatrix();
            controls.enabled = false;
          }
        } else if (!config.useExternal && modelAnimationMixer) {
          // 球形机：使用模型自带的动画
          modelAnimationMixer.update(delta);
          
          const isFinished = modelAnimationMixer._actions.every(action => {
            return action.isRunning() === false || action.time >= action.getClip().duration;
          });
          
          if (isFinished) {
            resetInstallAnimation();
            return;
          }
        }
      } else {
        controls.enabled = true;
      }
      
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
